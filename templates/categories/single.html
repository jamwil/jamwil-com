{% extends "anpu/templates/categories/single.html" %}

{% block content %}
  <h1>Category: {{ term.name }}</h1>
  <div class="article-info">
    <a href="{{ get_url(path='/categories') }}">To all categories</a>
  </div>

  {% for page in term.pages %}
    {{<site.page_listing page={page} config={config} />}}
  {% endfor %}
{% endblock content %}
