<html lang="en">

    <meta charset="utf-8" />

    <title>Subscribe</title>
    <meta name="description" content="Ramblings of a half-witted software developer." />

    <link rel="stylesheet" href="https://jamwil.com/main.css" />
  </head>
  <body>
    <a class="skip-main" href="#main">Skip to content</a>
    <div class="container">
      <header>
        <h1 class="site-header">
          <a href="https:&#x2F;&#x2F;jamwil.com">James Williams</a>
        </h1>
        <nav>
          <a href="https:&#x2F;&#x2F;jamwil.com&#x2F;about&#x2F;">About</a>

          <a href="https:&#x2F;&#x2F;jamwil.com&#x2F;categories&#x2F;">Categories</a>

          <a href="https:&#x2F;&#x2F;jamwil.com&#x2F;tags&#x2F;">Tags</a>
        </nav>
      </header>
      <main id="main" tabindex="-1">
        <article class="post">
          <div class="content">
            <p>
              Get notified of new posts on jamwil.com. No spam, no tracking—just a short plaintext
              notification when there’s something new to report.
            </p>
          </div>

          <div class="article-info">
            <div class="article-taxonomies"></div>
          </div>

          <form
            action="https://buttondown.com/api/emails/embed-subscribe/jamwil"
            method="post"
            target="popupwindow"
            onsubmit="window.open('https://buttondown.com/jamwil', 'popupwindow')"
            class="embeddable-buttondown-form"
          >
            <label for="bd-email">Enter your email</label>
            <input type="email" name="email" id="bd-email" required />

            <div class="checkbox-group">
              <input type="checkbox" name="tag" id="bd-tag" value="Technology" />
              <label for="bd-tag">Include technology content</label>
            </div>

            <input type="submit" value="Subscribe" />

            <p>
              <a href="https://buttondown.com/refer/jamwil" target="_blank"
                >Powered by Buttondown.</a
              >
            </p>
          </form>
        </article>
      </main>
      <footer>
        <p>
          © James Williams 2025<br />
          Powered by <a target="_blank" href="https://getzola.org/">Zola</a>, Theme
          <a target="_blank" href="https://github.com/zbrox/anpu-zola-theme">Anpu</a>.
        </p>
        <p>
          <a href="https://jamwil.com/subscribe">Subscribe via email</a><br />
          <script src="https://cdn.jsdelivr.net/npm/vanilla-lazyload@19.1.3/dist/lazyload.min.js"></script>
          <script>
            var lazyLoadInstance = new LazyLoad({
              threshold: 1000,

          </script>
        </p>
      </footer>
