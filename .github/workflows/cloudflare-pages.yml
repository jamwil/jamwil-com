name: CI + Deploy (Cloudflare Pages)

on:
  push:
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools (just + zola)
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y just

          ZOLA_VERSION="0.22.1"
          ZOLA_ARCHIVE="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          ZOLA_URL="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${ZOLA_ARCHIVE}"

          curl -fsSL "$ZOLA_URL" -o /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install -m 0755 /tmp/zola /usr/local/bin/zola

          just --version
          zola --version

      - name: Install Node dependencies
        run: npm ci

      - name: Lint / validate / build (preview-aware base_url)
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          # Preview deployments on Cloudflare Pages are served at:
          #   https://<branch>.<project>.pages.dev
          # Ensure Zola's base_url matches for non-main branch pushes.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "main" && -n "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            # Cloudflare turns branch names into a DNS-safe label for preview URLs.
            BRANCH_SAFE="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
            PREVIEW_BASE_URL="https://${BRANCH_SAFE}.${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev"
            echo "Using preview base_url: ${PREVIEW_BASE_URL}"
            just ci-preview "${PREVIEW_BASE_URL}"
          else
            just ci
          fi

      - name: Deploy to Cloudflare Pages (production on main, preview otherwise)
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing Cloudflare secrets; skipping deploy."
            exit 0
          fi

          npm exec -- wrangler pages deploy docs \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
